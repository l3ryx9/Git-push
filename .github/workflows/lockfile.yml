name: Générer le lockfile

# AUDIT-022 : crée (ou met à jour) package-lock.json pour que les builds installent
# toujours exactement les mêmes versions (npm ci). Lancement manuel uniquement :
# Actions → « Générer le lockfile » → Run workflow. Relis le commit produit avant de publier.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lockfile:
    name: Résoudre et commiter package-lock.json
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5

      - name: Installer Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Préparer package.json comme le build
        run: node ci/prepare.js

      - name: Résoudre les versions (sans exécuter de scripts d'installation)
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Audit des dépendances de production
        run: npm audit --omit=dev --audit-level=high || echo "::warning::npm audit signale des vulnérabilités élevées ou critiques."

      - name: Commiter le lockfile
        run: |
          git checkout -- package.json
          rm -f package.json.ci.bak
          if git diff --quiet -- package-lock.json 2>/dev/null && git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo "package-lock.json déjà à jour."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): package-lock.json généré par la CI"
          git push
