name: Publier une release

# Publie l'APK dans l'onglet Releases, avec notes de version automatiques et empreinte SHA-256.
#
# Deux façons de le lancer, toutes deux faisables depuis un téléphone :
#  1. Actions → « Publier une release » → Run workflow → saisis la version (ex : v1.0.0).
#  2. Releases → Draft a new release → crée le tag v1.0.0 → Publish (ou `git push` d'un tag v*).
#
# Le build lui-même est celui de build-apk.yml (réutilisé, rien n'est dupliqué).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version à publier (ex : v1.0.0, ou v1.0.0-beta.1 pour une pré-version)"
        type: string
        required: true
      prerelease:
        description: "Marquer comme pré-version"
        type: boolean
        default: false

permissions:
  contents: write # nécessaire pour créer le tag et la Release

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  version:
    name: Vérifier la version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - name: Valider le format de la version
        id: check
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::Version invalide « $TAG ». Utilise le format v1.2.3 (ou v1.2.3-beta.1)."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Version : $TAG"

  release:
    name: Compiler et publier
    needs: version
    uses: ./.github/workflows/build-apk.yml
    with:
      build_type: release
      abi: arm64-v8a
      minify: true
      publish: true
      tag: ${{ needs.version.outputs.tag }}
      prerelease: ${{ github.event.inputs.prerelease == 'true' }}
    secrets: inherit
