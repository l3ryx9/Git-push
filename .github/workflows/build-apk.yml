name: Build APK Android

# Build 100 % local sur GitHub : expo prebuild + Gradle.
# Aucun compte Expo, aucun token EXPO_TOKEN, aucun EAS.
#
# Lancer à la main : onglet Actions → « Build APK Android » → Run workflow.
# L'APK se télécharge ensuite depuis l'onglet Releases (lien direct, pratique sur téléphone)
# ou depuis les Artifacts du run.

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Type de build"
        type: choice
        options: [release, debug]
        default: release
      abi:
        description: "Architecture (arm64-v8a = téléphones récents : build plus rapide et APK plus léger)"
        type: choice
        options: [arm64-v8a, all]
        default: arm64-v8a
      minify:
        description: "Réduire / obfusquer le code natif (R8) : APK plus léger. Si R8 fait échouer le build, il est relancé automatiquement sans minification."
        type: boolean
        default: true
      publish:
        description: "Publier l'APK dans les Releases"
        type: boolean
        default: true
      random_signature:
        description: "Signature aléatoire : génère un keystore neuf à chaque build (aucun secret requis)"
        type: boolean
        default: false
  push:
    branches: [main, master]
    paths-ignore:
      - "**.md"
      - "docs/**"
  # Appelé par « Publier une release » (release.yml) : même build, puis publication dans les Releases.
  workflow_call:
    inputs:
      build_type:
        type: string
        default: release
      abi:
        type: string
        default: arm64-v8a
      minify:
        type: boolean
        default: true
      publish:
        type: boolean
        default: false
      random_signature:
        type: boolean
        default: false
      tag:
        description: "Version de la release (ex : v1.0.0). Vide : tag build-N."
        type: string
        default: ""
      prerelease:
        type: boolean
        default: false

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUILD_TYPE: ${{ inputs.build_type || 'release' }}
  ABI: ${{ inputs.abi || 'arm64-v8a' }}
  # Sur un push (sans formulaire), la minification est active ; le build se relance seul sans elle si R8 échoue.
  MINIFY: ${{ (github.event_name != 'workflow_dispatch' || inputs.minify) && 'true' || 'false' }}
  CI: "1"
  EXPO_NO_TELEMETRY: "1"
  EXPO_NO_GIT_STATUS: "1"
  PUBLISH: ${{ inputs.publish || 'false' }}
  RANDOM_SIGN: ${{ inputs.random_signature && 'true' || 'false' }}

jobs:
  build:
    name: Compiler l'APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 60
    outputs:
      cert_sha: ${{ steps.apk.outputs.cert_sha }}

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5

      - name: Refuser la publication d'un build non release
        run: |
          # AUDIT-023 : un APK debug (débogable, clé de debug) ne doit jamais finir dans les Releases.
          if [ "$PUBLISH" = "true" ] && [ "$BUILD_TYPE" != "release" ]; then
            echo "::error::Publication refusée : seul un build « release » peut être publié (build demandé : $BUILD_TYPE)."
            exit 1
          fi

      - name: Installer Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json', 'package.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Préparer package.json pour la CI
        run: node ci/prepare.js

      - name: Installer les dépendances
        run: |
          # AUDIT-022 : avec package-lock.json, installation exacte et reproductible (npm ci).
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            if [ "$PUBLISH" = "true" ]; then
              echo "::error::Publication refusée : package-lock.json absent (lance le workflow « Générer le lockfile »)."
              exit 1
            fi
            echo "::warning::package-lock.json absent : versions non verrouillées. Lance le workflow « Générer le lockfile »."
            npm install --no-audit --no-fund
          fi

      - name: Audit des dépendances (production)
        run: |
          # Non bloquant pour l'instant : les alertes apparaissent dans le résumé du run.
          npm audit --omit=dev --audit-level=high || echo "::warning::npm audit signale des vulnérabilités élevées ou critiques (voir le journal)."

      - name: Tests unitaires
        run: npm test

      - name: Vérification TypeScript
        run: npm run typecheck

      - name: Retirer les réglages liés à un compte Expo (owner, EAS, mises à jour OTA)
        run: |
          node -e '
            const fs = require("fs");
            const j = JSON.parse(fs.readFileSync("app.json", "utf8"));
            const e = j.expo || {};
            delete e.owner;
            delete e.updates;
            if (e.extra) {
              delete e.extra.eas;
              if (!Object.keys(e.extra).length) delete e.extra;
            }
            fs.writeFileSync("app.json", JSON.stringify(j, null, 2));
            console.log("app.json nettoyé pour un build local");
          '

      - name: Générer le projet Android (expo prebuild)
        run: npx expo prebuild --platform android --clean --no-install

      - name: Régler Gradle (mémoire, architectures, minification, SDK)
        run: |
          P=android/gradle.properties
          case "$ABI" in
            all) ARCHS="armeabi-v7a,arm64-v8a,x86,x86_64" ;;
            *) ARCHS="$ABI" ;;
          esac
          sed -i '/^org.gradle.jvmargs=/d;/^reactNativeArchitectures=/d;/^android.enableMinifyInReleaseBuilds=/d;/^android.enableShrinkResourcesInReleaseBuilds=/d' "$P"
          {
            echo ""
            echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
            echo "reactNativeArchitectures=$ARCHS"
            echo "android.enableMinifyInReleaseBuilds=$MINIFY"
            echo "android.enableShrinkResourcesInReleaseBuilds=$MINIFY"
          } >> "$P"
          # local.properties est prioritaire sur les variables d'environnement : Gradle trouve toujours le SDK.
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          echo "--- gradle.properties ---"
          cat "$P"

      - name: Accepter les licences du SDK Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Signature (keystore aléatoire ou secrets)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ "$RANDOM_SIGN" = "true" ]; then
            # Signature aléatoire : un keystore RSA 4096 neuf, mot de passe et alias tirés au hasard.
            # Il n'est ni stocké ni envoyé nulle part : il disparaît avec le runner à la fin du run.
            rand() { openssl rand -base64 96 | tr -dc 'A-Za-z0-9' | head -c "$1"; }
            ANDROID_STORE_PASSWORD="$(rand 40)"
            echo "::add-mask::$ANDROID_STORE_PASSWORD"
            ANDROID_KEY_PASSWORD="$ANDROID_STORE_PASSWORD"   # PKCS12 : même mot de passe pour le store et la clé
            ANDROID_KEY_ALIAS="k$(rand 11 | tr 'A-Z' 'a-z')"
            keytool -genkeypair -storetype PKCS12 \
              -keystore android/app/release.keystore \
              -alias "$ANDROID_KEY_ALIAS" \
              -keyalg RSA -keysize 4096 -validity 10000 \
              -storepass "$ANDROID_STORE_PASSWORD" -keypass "$ANDROID_KEY_PASSWORD" \
              -dname "CN=Git-Push $(rand 12), O=Git-Push, C=FR"
            chmod 600 android/app/release.keystore
            {
              echo "ANDROID_STORE_PASSWORD=$ANDROID_STORE_PASSWORD"
              echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
              echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            } >> "$GITHUB_ENV"
            export ANDROID_STORE_PASSWORD ANDROID_KEY_PASSWORD ANDROID_KEY_ALIAS
            echo "Keystore aléatoire généré (alias : $ANDROID_KEY_ALIAS)."
          else
            if [ "$PUBLISH" = "true" ] && [ -z "$KS_B64" ]; then
              echo "::error::Publication refusée : configure ANDROID_KEYSTORE_BASE64 et les trois secrets de signature (ou active « signature aléatoire »)."
              exit 1
            fi
            if [ -n "$KS_B64" ]; then
              if [ -z "$ANDROID_STORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
                echo "::error::Secrets de signature incomplets."
                exit 1
              fi
              printf '%s' "$KS_B64" | base64 --decode > android/app/release.keystore
              test -s android/app/release.keystore
              chmod 600 android/app/release.keystore
              echo "Keystore release installé."
            else
              echo "Pas de keystore : build non publié signé en debug."
            fi
          fi
          node ci/sign-android.js

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Compiler l'APK (Gradle, avec relance automatique si R8 ou le réseau échoue)
        env:
          ANDROID_STORE_PASSWORD: ${{ env.ANDROID_STORE_PASSWORD || secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ env.ANDROID_KEY_ALIAS || secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ env.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # 3 essais au plus, mais retryBuild.js ne relance que dans deux cas : échec causé par R8
          # (relance sans minification) ou coupure réseau passagère. Toute autre erreur arrête le build.
          export MAX_BUILD_ATTEMPTS=3
          node ci/retryBuild.js

      - name: Récupérer et vérifier l'APK
        id: apk
        env:
          EXPECTED_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          mkdir -p dist
          APK=$(find "android/app/build/outputs/apk/$BUILD_TYPE" -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::Aucun APK trouvé dans android/app/build/outputs/apk/$BUILD_TYPE"
            exit 1
          fi
          OUT="dist/Git-Push-$BUILD_TYPE-${{ github.run_number }}.apk"
          cp "$APK" "$OUT"
          # AUDIT-023 : vérification réelle de la signature de l'APK produit.
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner introuvable : signature non vérifiable."
            exit 1
          fi
          "$APKSIGNER" verify --print-certs "$OUT" | tee apk-cert.txt
          CERT_SHA=$(grep -m1 "certificate SHA-256 digest" apk-cert.txt | awk '{print $NF}' | tr 'A-F' 'a-f')
          if [ "$PUBLISH" = "true" ]; then
            if grep -qi "CN=Android Debug" apk-cert.txt; then
              echo "::error::L'APK est signé avec la clé de DEBUG : publication refusée."
              exit 1
            fi
            if [ "$RANDOM_SIGN" = "true" ]; then
              echo "Signature aléatoire : empreinte attendue ignorée, empreinte réelle : $CERT_SHA"
            elif [ -n "$EXPECTED_CERT_SHA256" ]; then
              EXPECTED=$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ': ' | tr 'A-F' 'a-f')
              if [ "$CERT_SHA" != "$EXPECTED" ]; then
                echo "::error::Certificat inattendu ($CERT_SHA) : publication refusée."
                exit 1
              fi
            else
              echo "::warning::Variable ANDROID_CERT_SHA256 non définie : le certificat n'est pas comparé à l'empreinte attendue."
            fi
          fi
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          echo "cert_sha=$CERT_SHA" >> "$GITHUB_OUTPUT"
          SIZE=$(du -h "$OUT" | cut -f1)
          {
            echo "## ✅ APK prêt"
            echo ""
            echo "- Fichier : \`$(basename "$OUT")\` ($SIZE)"
            echo "- Type : $BUILD_TYPE · Architecture : $ABI · Minification : $MINIFY"
            echo "- Signature : $([ "$RANDOM_SIGN" = "true" ] && echo "aléatoire (keystore jetable)" || echo "keystore des secrets") · SHA-256 du certificat : \`$CERT_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Envoyer l'APK en artefact
        uses: actions/upload-artifact@v7
        with:
          name: Git-Push-${{ env.BUILD_TYPE }}-${{ github.run_number }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Résumé des erreurs
        if: failure()
        run: |
          {
            echo "## ❌ Le build a échoué"
            echo ""
            echo "Copie les lignes ci-dessous pour les faire corriger :"
            echo ""
            echo '```'
            shopt -s nullglob
            LOGS=(ci/logs/build-attempt-*.log)
            if [ ${#LOGS[@]} -gt 0 ]; then
              grep -hE "^e: |error:|FAILURE:|What went wrong|Caused by|Execution failed|Unresolved reference|Could not resolve" "${LOGS[@]}" | tail -n 60 | cut -c1-300 || true
            else
              echo "(pas de log Gradle : l'échec vient d'une étape précédente, ouvre le journal de l'étape en rouge)"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Envoyer les journaux de build
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs-${{ github.run_number }}
          path: ci/logs
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Publier la release
    needs: build
    if: inputs.publish == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Télécharger l'APK compilé
        uses: actions/download-artifact@v7
        with:
          name: Git-Push-${{ env.BUILD_TYPE }}-${{ github.run_number }}
          path: dist

      - name: Calculer l'empreinte SHA-256
        run: |
          cd dist
          sha256sum ./*.apk | sed 's# \\./# #' > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publier dans les Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || format('build-{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          name: "Git-Push ${{ inputs.tag || format('{0} #{1}', env.BUILD_TYPE, github.run_number) }}"
          generate_release_notes: ${{ inputs.tag != '' }}
          prerelease: ${{ inputs.prerelease || contains(inputs.tag, '-') }}
          body: |
            APK ${{ env.BUILD_TYPE }} · architecture ${{ env.ABI }} · commit ${{ github.sha }}

            **Installer** : télécharge l'APK ci-dessous, ouvre-le et autorise l'installation depuis cette source si Android le demande.
            **Vérifier** : l'empreinte SHA-256 est dans `SHA256SUMS.txt`.

            **Signature** : ${{ env.RANDOM_SIGN == 'true' && 'aléatoire (keystore généré pour cette release uniquement, jamais conservé).' || 'keystore du dépôt.' }}
            SHA-256 du certificat : `${{ needs.build.outputs.cert_sha }}`
            ${{ env.RANDOM_SIGN == 'true' && '⚠️ Chaque release ayant sa propre clé, Android refuse de mettre à jour une version déjà installée : désinstalle l’ancienne avant d’installer celle-ci.' || '' }}
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
